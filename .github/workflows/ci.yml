name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run check-types

      - name: Lint
        run: pnpm run lint

      # `test:ci` compiles the tests, builds the production (minified) bundle,
      # and runs the suite against that bundle - so tests exercise the same
      # artifact that ships to the Marketplace (plain `pnpm test` rebuilds a dev
      # bundle via its pretest hook). The headless VS Code (Electron) needs a
      # virtual display on Linux runners.
      - name: Build and test (production bundle)
        run: xvfb-run -a pnpm run test:ci
